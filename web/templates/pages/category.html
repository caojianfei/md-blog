{{define "category"}}{{template "base" .}}{{end}}
{{define "content"}}
<section class="container" style="padding: 40px 0 48px;"><div class="card"><h1>分类：{{.CurrentCategory.Name}}</h1><p class="muted">{{.CurrentCategory.Description}}</p></div>{{if .Articles}}{{range .Articles}}{{template "article_card" .}}{{end}}{{else}}<div class="card empty">当前分类下暂无文章。</div>{{end}}</section>
{{end}}
