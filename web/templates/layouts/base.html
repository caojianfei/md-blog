{{define "base"}}
<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{template "seo_head" .}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function () {
      var storageKey = "site-theme";
      var defaultTheme = "{{if .Site.ThemeDefault}}{{.Site.ThemeDefault}}{{else}}system{{end}}";
      var savedTheme = localStorage.getItem(storageKey);
      var theme = savedTheme || defaultTheme || "system";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="site-shell">
  <div class="site-bg" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-brand" href="/">
        <span class="site-brand__prefix">$ ./</span>
        <strong>{{.Site.SiteName}}</strong>
        <span class="site-brand__subtitle">{{.Site.SiteSubtitle}}</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a class="{{if eq .Path "/"}}is-active{{end}}" href="/">首页</a>
        <a class="{{if eq .Path "/archives"}}is-active{{end}}" href="/archives">归档</a>
        <a class="{{if eq .Path "/about"}}is-active{{end}}" href="/about">关于</a>
        <a href="/rss.xml">RSS</a>
      </nav>
      <button
        class="theme-toggle"
        type="button"
        data-theme-toggle
        aria-label="切换主题"
        data-theme-default="{{if .Site.ThemeDefault}}{{.Site.ThemeDefault}}{{else}}system{{end}}"
      >
        <span data-theme-toggle-label>theme: auto</span>
      </button>
    </div>
  </header>
  <main class="site-main">
    {{template "content" .}}
  </main>
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>{{if .Site.FooterText}}{{.Site.FooterText}}{{else}}Powered by Go SSR{{end}}</span>
      <div class="site-footer__meta">
        {{if .Site.GithubURL}}<a href="{{.Site.GithubURL}}" target="_blank" rel="noreferrer">GitHub</a>{{end}}
        {{if .Site.ICP}}<span>{{.Site.ICP}}</span>{{end}}
      </div>
    </div>
  </footer>
  <script src="/assets/frontend.js" defer></script>
</body>
</html>
{{end}}
