{{define "base"}}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{template "seo_head" .}}
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <strong>{{.Site.SiteName}}</strong>
        <span>{{.Site.SiteSubtitle}}</span>
      </a>
      <nav class="nav">
        <a href="/">首页</a>
        <a href="/archives">归档</a>
        <a href="/about">关于</a>
        <a href="/rss.xml">RSS</a>
      </nav>
    </div>
  </header>
  <main>
    {{template "content" .}}
  </main>
  <footer class="footer">
    <div class="container">{{.Site.FooterText}}</div>
  </footer>
</body>
</html>
{{end}}
