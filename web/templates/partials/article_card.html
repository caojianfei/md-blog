{{define "article_card"}}
<article class="article-row">
  <div class="article-row__date">{{formatDate .PublishedAt "2006-01-02"}}</div>
  <div>
    <h2 class="article-row__title"><a href="/posts/{{pathEscape .Slug}}">{{.Title}}</a></h2>
    <p class="article-row__summary">{{.Excerpt}}</p>
    <div class="article-row__meta">
      {{if .Tags}}
      <div class="article-row__tags">
        {{range .Tags}}<a class="tag-chip" href="/tags/{{pathEscape .Slug}}"># {{.Name}}</a>{{end}}
      </div>
      {{end}}
    </div>
  </div>
</article>
{{end}}
